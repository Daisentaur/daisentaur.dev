<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 — daisentaur</title>
        <meta name="robots" content="noindex" />

        <!-- Blocking: sets the theme before first paint (no flash). -->
        <!-- Root-absolute paths: a 404 can be served at any URL depth. -->
        <script src="/theme.js"></script>

        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Spline+Sans+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="/style.css" />

        <style>
            /* 404 is deliberately its own thing: the site's fonts + colours,
               but a big cardboard-figure backdrop and no hero/footer chrome. */
            .oops {
                min-height: calc(100vh - 64px);
                display: flex;
                justify-content: center;
                padding: 34px 24px 0;
                /* the logo, big and clearly visible behind everything */
                background-image: url("/apple-touch-icon.png");
                background-repeat: no-repeat;
                background-position: center 64%;
                background-size: min(66vmin, 460px);
            }
            .oops-inner {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                color: var(--accent);
            }
            /* arrow first — it points up at the top bar */
            .oops-arrow {
                display: block;
            }
            .oops-msg {
                margin: 0;
                font-family: var(--font-mono);
                font-size: clamp(1.05rem, 3.4vw, 1.5rem);
                color: var(--ink);
                letter-spacing: -0.01em;
            }
            @media (prefers-reduced-motion: no-preference) {
                .oops-arrow {
                    animation: nudge 1.4s ease-in-out infinite;
                }
                @keyframes nudge {
                    0%, 100% { transform: translateY(0); }
                    50% { transform: translateY(-6px); }
                }
            }
        </style>
    </head>
    <body>
        <a href="#main" class="skip-link">Skip to content</a>

        <header class="site-header">
            <div class="wrap">
                <a class="mark" href="/index.html">daisentaur<span class="dot">.dev</span></a>
                <nav aria-label="Primary">
                    <a href="/about.html">about</a>
                    <a href="/work.html">work</a>
                    <a href="/writing.html">writing</a>
                    <a href="https://github.com/Daisentaur" rel="me noopener" target="_blank">github&nbsp;↗</a>
                    <button class="theme-toggle" type="button" aria-label="Toggle dark and light theme" title="Toggle theme">
                        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </button>
                </nav>
            </div>
        </header>

        <main id="main" class="oops">
            <div class="oops-inner">
                <svg class="oops-arrow" width="34" height="72" viewBox="0 0 34 72" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="17" y1="68" x2="17" y2="7" />
                    <polyline points="6,20 17,5 28,20" />
                </svg>
                <p class="oops-msg">that's not there, maybe something else</p>
            </div>
        </main>
    </body>
</html>
