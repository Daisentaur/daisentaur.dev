<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 — daisentaur</title>
        <meta name="robots" content="noindex" />

        <!-- Blocking: sets the theme before first paint (no flash). -->
        <!-- Root-absolute paths: a 404 can be served at any URL depth. -->
        <script src="/theme.js"></script>

        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Spline+Sans+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="/style.css" />

        <style>
            /* 404: the site's display font, its own two-column layout.
               Figure and arrow are real in-flow elements (not a detached
               background) so the theme-toggle reveal wipes over them cleanly. */
            .oops {
                min-height: calc(100vh - 64px);
                display: flex;
                align-items: center;
                gap: 4vw;
                padding: 0 clamp(24px, 6vw, 84px);
            }
            .oops-fig {
                flex: 1;
                display: flex;
                justify-content: center;
            }
            .oops-fig img {
                width: min(40vw, 400px);
                height: auto;
            }
            .oops-text {
                flex: 1;
                display: flex;
                justify-content: center;
            }
            .oops-msg {
                margin: 0;
                font-family: var(--font-display);
                font-weight: 400;
                font-size: clamp(1.9rem, 4vw, 3rem);
                line-height: 1.12;
                letter-spacing: -0.02em;
                color: var(--ink);
                text-align: center;
                max-width: 15ch;
            }
            .oops-msg em {
                font-style: italic;
                color: var(--accent);
            }
            @media (max-width: 640px) {
                .oops {
                    flex-direction: column;
                    justify-content: center;
                    text-align: center;
                    gap: 20px;
                    padding-top: 36px;
                }
                .oops-fig img {
                    width: min(52vw, 230px);
                }
            }
        </style>
    </head>
    <body>
        <a href="#main" class="skip-link">Skip to content</a>

        <header class="site-header">
            <div class="wrap">
                <a class="mark" href="/index.html">daisentaur<span class="dot">.dev</span></a>
                <nav aria-label="Primary">
                    <a href="/about.html">about</a>
                    <a href="/work.html">work</a>
                    <a href="/writing.html">writing</a>
                    <a href="https://github.com/Daisentaur" rel="me noopener" target="_blank">github&nbsp;↗</a>
                    <button class="theme-toggle" type="button" aria-label="Toggle dark and light theme" title="Toggle theme">
                        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </button>
                </nav>
            </div>
        </header>

        <main id="main" class="oops">
            <div class="oops-fig">
                <img src="/apple-touch-icon.png" alt="" />
            </div>
            <div class="oops-text">
                <p class="oops-msg">that's not there, maybe <em>something else</em></p>
            </div>
        </main>
    </body>
</html>
